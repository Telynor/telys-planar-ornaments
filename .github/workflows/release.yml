name: Build Planar Ornament Release
on:
  push:
    branches: [main, 'codex/audit-*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run regression tests
        run: node --test tests/*.test.mjs
      - name: Check designer registration and save in Chromium
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.64.1 jquery@3.7.1 jsdom@26.1.0
          npx playwright install --with-deps chromium --only-shell
          node tests/sheet-stats-dom.cjs
          node tests/first-sheet-ui.cjs
          node tests/designer-ui.cjs
      - name: Upload designer screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planar-designer
          path: artifacts/*.png
          if-no-files-found: ignore
      - name: Read version
        id: version
        run: echo "value=$(jq -r '.version' module.json)" >> "$GITHUB_OUTPUT"
      - name: Build package
        run: zip -r telys-planar-ornaments.zip module.json README.md ASSETS-AGPL-3.0.txt assets scripts styles
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.value }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" telys-planar-ornaments.zip module.json --clobber
          else
            gh release create "$tag" telys-planar-ornaments.zip module.json --title "$tag" --generate-notes --target main
          fi
